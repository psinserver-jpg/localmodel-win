[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmw"
version = "0.1.0"
description = "Skill pack + orchestrator that keeps local LLMs on task: think, plan, build, review, fix, deliver."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
lmw = "lmw.cli:main"

[tool.setuptools]
packages = ["lmw"]
